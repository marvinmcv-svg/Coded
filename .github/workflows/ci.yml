name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coded
          POSTGRES_PASSWORD: coded
          POSTGRES_DB: coded
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coded" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://coded:coded@localhost:5432/coded
      SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

      - name: Migrate + seed (schema smoke test)
        run: pnpm db:migrate && pnpm db:seed
      - name: Content check (i18n parity + past cohorts)
        run: pnpm content:check

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (e2e, axe, JS budget)
        run: pnpm test:e2e

      - name: Lighthouse CI
        run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
